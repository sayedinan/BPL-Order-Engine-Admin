# v0.3 frontend — nginx config for the static SPA image.
#
# This nginx is the *internal* static-file server. The public edge
# is the Caddy reverse proxy (see Caddyfile at the repo root); that
# proxy terminates TLS and forwards /api/* to the backend. From the
# browser's point of view, the SPA and the API are same-origin, so
# CORS is not in play for production traffic.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints assets in /assets/* — safe to cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html so React
    # Router can take over (/dashboard, /logs, /change-password, ...).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Tiny health endpoint for the docker healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
