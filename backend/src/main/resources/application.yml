spring:
  application:
    name: engine-helm
  datasource:
    url: jdbc:h2:file:./data/enginehelm;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        http-only: true

# V1 demo only — CORS allowlist for the Vite dev origin.
# Production builds serve the SPA from the same origin; this config
# is dev-only.
enginehelm:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.springframework.security: INFO
    com.enginehelm: INFO
