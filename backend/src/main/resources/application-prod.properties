# v0.3 prod profile — env-driven only, no in-line defaults.
#
# Every value that lacks a default is enforced by
# RequiredEnvValidator at startup (see META-INF/spring/...imports).
# Missing/blank values => app exits with a clear error message.

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- JPA / Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Hardening: don't keep a Hibernate session open for the duration of
# view rendering. The codebase already returns DTOs, not entities,
# so this is safe to disable.
spring.jpa.open-in-view=false

# --- CORS (required) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Actuator (probes for the reverse proxy / orchestrator) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Hide stack traces from the unauthenticated /error path.
server.error.include-stacktrace=never
server.error.include-message=always

# --- Logging ---
logging.level.root=INFO
logging.level.com.BPL_Order_Engine_Admin=INFO
