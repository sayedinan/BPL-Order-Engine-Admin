plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot starters — per SPEC §2.4
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Flyway + Postgres
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly    'org.postgresql:postgresql'

	// JWT (jjwt)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Jasypt (engine.serverPassword encryption)
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

	// Apache MINA SSHD (real SSH to engine servers)
	implementation 'org.apache.sshd:sshd-core:2.13.2'
	implementation 'org.apache.sshd:sshd-common:2.13.2'

	// H2 (so the bootRun task can bring the app up against an
	// in-memory DB for smoke verification; postgres is the prod/dev
	// default).
	runtimeOnly    'com.h2database:h2:2.2.224'

	// Lombok
	compileOnly           'org.projectlombok:lombok'
	annotationProcessor   'org.projectlombok:lombok'

	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	runtimeOnly        'com.h2database:h2:2.2.224'
	testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
	testCompileOnly           'org.projectlombok:lombok'
	testAnnotationProcessor   'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
